<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THelectrics</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#FAFAF7;
    --surface:#FFFFFF;
    --ink:#1C2430;
    --muted:#5B6472;
    --accent:#E8912B;
    --accent-hover:#D67F1C;
    --border:#E7E2D6;
    --focus:#1C2430;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181F;
      --surface:#1B212B;
      --ink:#F2F0EA;
      --muted:#9BA3AF;
      --accent:#F0A43D;
      --accent-hover:#F5B863;
      --border:#2A313C;
      --focus:#F0A43D;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181F;
    --surface:#1B212B;
    --ink:#F2F0EA;
    --muted:#9BA3AF;
    --accent:#F0A43D;
    --accent-hover:#F5B863;
    --border:#2A313C;
    --focus:#F0A43D;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Work Sans", -apple-system, "Segoe UI", sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Manrope", -apple-system, "Segoe UI", sans-serif;
    font-weight:800;
    line-height:1.12;
    text-wrap:balance;
    margin:0;
    letter-spacing:-0.01em;
  }
  p{margin:0;}
  a{color:inherit;}
  img,svg{max-width:100%;}
  ::selection{background:var(--accent);color:var(--ink);}
  :focus-visible{outline:2px solid var(--focus);outline-offset:3px;}
  .icon{width:22px;height:22px;flex-shrink:0;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  @media (prefers-reduced-motion: no-preference){
    .fade-up{animation:fadeUp .6s ease-out both;}
    .fade-up.d1{animation-delay:.08s;}
    .fade-up.d2{animation-delay:.16s;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  }

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  header{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;}
  .brand .mark{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;}
  .brand .mark img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand span{font-family:"Manrope",sans-serif;font-weight:800;font-size:1.22rem;letter-spacing:-0.01em;}
  .navlinks{display:flex;align-items:center;gap:26px;font-size:0.94rem;font-weight:500;}
  .navlinks a{text-decoration:none;color:var(--muted);}
  .navlinks a:hover{color:var(--ink);}
  @media (max-width:780px){.navlinks{display:none;}}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .phone-link{display:flex;align-items:center;gap:7px;font-weight:700;font-size:0.98rem;text-decoration:none;white-space:nowrap;}
  .phone-link svg{width:17px;height:17px;stroke:var(--accent);}

  .btn{display:inline-flex;align-items:center;gap:8px;font-family:"Manrope",sans-serif;font-weight:700;font-size:0.95rem;text-decoration:none;padding:12px 22px;border-radius:9px;white-space:nowrap;border:1.5px solid transparent;}
  .btn-solid{background:var(--accent);color:var(--ink);}
  .btn-solid:hover{background:var(--accent-hover);}
  .btn-outline{border-color:var(--border);color:var(--ink);}
  .btn-outline:hover{border-color:var(--accent);}

  .hero{padding:76px 0 60px;}
  .hero-grid{display:grid;grid-template-columns:1fr;gap:20px;max-width:720px;}
  .eyebrow{font-weight:700;font-size:0.86rem;color:var(--accent);letter-spacing:0.01em;}
  .hero h1{font-size:clamp(2.2rem,5vw,3.2rem);margin-top:10px;}
  .hero p.lede{font-size:1.14rem;color:var(--muted);margin:20px 0 30px;max-width:52ch;}
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px;}
  .trust-strip{display:flex;gap:28px;flex-wrap:wrap;}
  .trust-item{display:flex;align-items:center;gap:9px;font-size:0.92rem;font-weight:500;color:var(--muted);}
  .trust-item svg{width:18px;height:18px;stroke:var(--accent);}

  section{padding:64px 0;border-top:1px solid var(--border);}
  .section-head{max-width:600px;margin-bottom:40px;}
  .section-head .eyebrow{display:block;margin-bottom:8px;}
  .section-head h2{font-size:clamp(1.55rem,3vw,2.1rem);}
  .section-head p{color:var(--muted);margin-top:12px;font-size:1.02rem;}

  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media (max-width:860px){.grid-3{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.grid-3{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px;}
  .card .icon-badge{width:44px;height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
  .card h3{font-size:1.06rem;}
  .card p{color:var(--muted);font-size:0.96rem;}

  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  @media (max-width:860px){.grid-4{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.grid-4{grid-template-columns:1fr;}}
  .why-item{display:flex;flex-direction:column;gap:12px;}
  .why-item .icon-badge{width:46px;height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
  .why-item h3{font-size:1.0rem;}
  .why-item p{color:var(--muted);font-size:0.92rem;}

  .areas-band{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;}
  .areas-band p{color:var(--muted);max-width:34ch;}
  .pills{display:flex;flex-wrap:wrap;gap:9px;max-width:520px;}
  .pill{font-size:0.88rem;font-weight:500;padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--border);}

  .faq-item{border-bottom:1px solid var(--border);padding:18px 0;}
  .faq-item summary{font-family:"Manrope",sans-serif;font-weight:700;font-size:1.03rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .faq-item summary::-webkit-details-marker{display:none;}
  .faq-item summary .plus{width:22px;height:22px;flex-shrink:0;border-radius:6px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--accent);}
  .faq-item[open] summary .plus{transform:rotate(45deg);}
  .faq-item p{color:var(--muted);margin-top:12px;max-width:64ch;}

  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;}
  @media (max-width:800px){.contact-grid{grid-template-columns:1fr;}}
  .contact-grid h2{font-size:clamp(1.6rem,3vw,2.15rem);max-width:16ch;}
  .contact-cards{display:flex;flex-direction:column;gap:12px;}
  .contact-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .contact-card .left{display:flex;align-items:center;gap:14px;}
  .contact-card .icon-badge{width:38px;height:38px;border-radius:9px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .contact-card .k{font-size:0.78rem;color:var(--muted);}
  .contact-card .v{font-weight:700;text-decoration:none;font-size:1rem;}
  .copy-btn{font-size:0.75rem;font-weight:600;color:var(--muted);background:none;border:1px solid var(--border);padding:6px 10px;cursor:pointer;border-radius:7px;}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent);}

  footer{border-top:1px solid var(--border);padding:32px 0;}
  .foot-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:0.86rem;color:var(--muted);}
  .foot-brand{display:flex;align-items:center;gap:8px;font-family:"Manrope",sans-serif;font-weight:700;color:var(--ink);}
  .foot-brand .mark{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .foot-brand .mark img{width:100%;height:100%;object-fit:contain;display:block;}

  /* Motion: power-on intro (wires connect, then the light comes on) */
  #power-overlay{position:fixed;inset:0;z-index:9999;background:#05060a;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  #power-rig{position:relative;width:min(340px,82vw);height:min(340px,82vw);}
  #power-wires{position:absolute;inset:0;width:100%;height:100%;}
  .wire{fill:none;stroke:#E8912B;stroke-width:2.4;stroke-linecap:round;opacity:.85;stroke-dasharray:1;stroke-dashoffset:1;}
  .wire-node{fill:#E8912B;opacity:0;transform-box:fill-box;transform-origin:center;}
  #power-bolt{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:34%;height:34%;object-fit:contain;opacity:0;}

  @media (prefers-reduced-motion: no-preference){
    .wire{animation:wireConnect .9s ease-out forwards;}
    .wire:nth-child(2){animation-delay:.08s;}
    .wire:nth-child(3){animation-delay:.16s;}
    .wire-node{animation:nodePop .3s ease-out forwards;animation-delay:.95s;}
    #power-bolt{animation:boltDim .3s linear forwards, boltFlicker .9s linear forwards, boltOn .2s ease-out forwards;animation-delay:1.05s,1.35s,2.25s;}
    #power-overlay{animation:overlayFadeOut .3s ease-in forwards;animation-delay:2.3s;}
  }
  @media (prefers-reduced-motion: reduce){
    #power-overlay{display:none;}
  }
  @keyframes wireConnect{from{stroke-dashoffset:1;}to{stroke-dashoffset:0;}}
  @keyframes nodePop{0%{opacity:0;transform:scale(.2);}60%{opacity:1;transform:scale(1.3);}100%{opacity:1;transform:scale(1);}}
  @keyframes boltDim{from{opacity:0;}to{opacity:.25;}}
  @keyframes boltFlicker{
    0%{opacity:.25;filter:drop-shadow(0 0 0 transparent);}
    15%{opacity:.6;}
    25%{opacity:.15;}
    40%{opacity:.7;filter:drop-shadow(0 0 4px rgba(232,145,43,.5));}
    55%{opacity:.2;}
    70%{opacity:.8;filter:drop-shadow(0 0 8px rgba(232,145,43,.6));}
    100%{opacity:.3;}
  }
  @keyframes boltOn{from{opacity:.3;filter:drop-shadow(0 0 8px rgba(232,145,43,.6));}to{opacity:1;filter:drop-shadow(0 0 20px #E8912B);}}
  @keyframes overlayFadeOut{from{opacity:1;}to{opacity:0;}}

  /* Motion: reveal-on-scroll */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease-out, transform .6s ease-out;}
  .reveal.revealed{opacity:1;transform:translateY(0);}

  /* Motion: ringing call button */
  .ring-btn{position:relative;}
  .ring-btn::after{content:'';position:absolute;inset:-4px;border-radius:12px;border:2px solid var(--accent);pointer-events:none;opacity:0;}

  /* Motion: charged logo mark */
  @media (prefers-reduced-motion: no-preference){
    .brand .mark{animation:boltGlow 3.2s ease-in-out infinite;}
    .ring-btn::after{animation:ringPulse 2.4s ease-out infinite;}
    @keyframes boltGlow{
      0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);}
      50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent);}
    }
    @keyframes ringPulse{
      0%{transform:scale(1);opacity:.55;}
      75%{transform:scale(1.14);opacity:0;}
      100%{opacity:0;}
    }
  }

  /* Motion: headline comes into focus, then a slow current runs through it */
  .hero h1{overflow:visible;}
  .h-wire,.h-fast{
    display:inline-block;
    color:var(--ink);
    background-image:linear-gradient(100deg, var(--ink) 42%, color-mix(in srgb, var(--ink) 45%, var(--accent) 55%) 50%, var(--ink) 58%);
    background-size:260% 100%;
    background-position:160% 0;
  }
  @supports ((background-clip:text) or (-webkit-background-clip:text)){
    .h-wire,.h-fast{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  }
  html.power-anim .h-wire,html.power-anim .h-fast{opacity:0;filter:blur(9px);transform:translateY(10px);}
  @keyframes headlineFocus{
    to{opacity:1;filter:blur(0);transform:translateY(0);}
  }
  @media (prefers-reduced-motion: no-preference){
    .h-wire{animation-name:headlineFocus, currentSweep;animation-duration:.8s, 5s;animation-timing-function:cubic-bezier(.22,1,.36,1), linear;animation-delay:2.3s, 3.1s;animation-iteration-count:1, infinite;animation-fill-mode:forwards, none;}
    .h-fast{animation-name:headlineFocus, currentSweep;animation-duration:.8s, 5s;animation-timing-function:cubic-bezier(.22,1,.36,1), linear;animation-delay:2.42s, 3.1s;animation-iteration-count:1, infinite;animation-fill-mode:forwards, none;}
  }
  @keyframes currentSweep{
    from{background-position:0% 0;}
    to{background-position:-260% 0;}
  }

  .trust-item svg,.phone-link svg{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>

<script>
(function(){
  function icon(name, cls){
    return '<svg'+(cls?' class="'+cls+'"':'')+' aria-hidden="true"><use href="#icon-'+name+'"></use></svg>';
  }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function setText(id, val){ var e=document.getElementById(id); if(e) e.textContent = val==null?'':val; }
  function setHTML(id, val){ var e=document.getElementById(id); if(e) e.innerHTML = val==null?'':val; }
  function onlyDigits(s){ return String(s||'').replace(/[^0-9+]/g,''); }
  function shade(hex, percent){
    try{
      var f = hex.replace('#','');
      var num = parseInt(f,16);
      var r = Math.max(0,Math.min(255,(num>>16)+Math.round(percent*2.55)));
      var g = Math.max(0,Math.min(255,((num>>8)&0x00FF)+Math.round(percent*2.55)));
      var b = Math.max(0,Math.min(255,(num&0x0000FF)+Math.round(percent*2.55)));
      return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
    }catch(e){ return hex; }
  }

  function render(c){
    if (c.theme && c.theme.accent){
      document.documentElement.style.setProperty('--accent', c.theme.accent);
      document.documentElement.style.setProperty('--accent-hover', shade(c.theme.accent, -12));
    }
    if (c.brand){
      document.title = c.brand.name || 'THelectrics';
      document.querySelectorAll('[data-bind="brand-name"], [data-bind="brand-name-footer"]').forEach(function(n){ n.textContent = c.brand.name; });
      if (c.brand.logoDataUrl){
        ['brand-logo-header','brand-logo-footer','power-bolt'].forEach(function(id){
          var img = document.getElementById(id);
          if (img) img.src = c.brand.logoDataUrl;
        });
      }
    }

    var navRoot = document.getElementById('nav-links');
    if (navRoot && c.nav){
      navRoot.innerHTML = c.nav.map(function(item){ return '<a href="'+esc(item.href)+'">'+esc(item.label)+'</a>'; }).join('');
    }

    if (c.header){
      var headerPhone = document.getElementById('header-phone');
      if (headerPhone){
        headerPhone.href = 'tel:'+onlyDigits(c.header.phone);
        headerPhone.innerHTML = icon('phone') + esc(c.header.phone);
      }
      var headerCta = document.getElementById('header-cta');
      if (headerCta){ headerCta.textContent = c.header.ctaLabel; headerCta.href = c.header.ctaHref; }
    }

    if (c.hero){
      setText('hero-eyebrow', c.hero.eyebrow);
      setHTML('hero-headline', '<span class="h-wire">'+esc(c.hero.headlinePart1)+'</span> <span class="h-fast">'+esc(c.hero.headlinePart2)+'</span>');
      setText('hero-lede', c.hero.lede);
      var p1 = document.getElementById('hero-cta-primary');
      if (p1){ p1.textContent = c.hero.ctaPrimaryLabel; p1.href = c.hero.ctaPrimaryHref; }
      var p2 = document.getElementById('hero-cta-secondary');
      if (p2){ p2.textContent = c.hero.ctaSecondaryLabel; p2.href = c.hero.ctaSecondaryHref; }
      var trust = document.getElementById('hero-trust');
      if (trust && c.hero.trustItems){
        trust.innerHTML = c.hero.trustItems.map(function(t){
          return '<div class="trust-item">'+icon(t.icon)+esc(t.text)+'</div>';
        }).join('');
      }
    }

    if (c.services){
      setText('services-eyebrow', c.services.eyebrow);
      setText('services-heading', c.services.heading);
      setText('services-intro', c.services.intro);
      var grid = document.getElementById('services-grid');
      if (grid && c.services.items){
        grid.innerHTML = c.services.items.map(function(s){
          return '<div class="card"><div class="icon-badge">'+icon(s.icon,'icon')+'</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.description)+'</p></div>';
        }).join('');
      }
    }

    if (c.whyUs){
      setText('whyus-eyebrow', c.whyUs.eyebrow);
      setText('whyus-heading', c.whyUs.heading);
      var wgrid = document.getElementById('whyus-grid');
      if (wgrid && c.whyUs.items){
        wgrid.innerHTML = c.whyUs.items.map(function(w){
          return '<div class="why-item"><div class="icon-badge">'+icon(w.icon,'icon')+'</div><h3>'+esc(w.title)+'</h3><p>'+esc(w.description)+'</p></div>';
        }).join('');
      }
    }

    if (c.areas){
      setText('areas-eyebrow', c.areas.eyebrow);
      setText('areas-intro', c.areas.intro);
      var pillsRoot = document.getElementById('areas-pills');
      if (pillsRoot && c.areas.pills){
        pillsRoot.innerHTML = c.areas.pills.map(function(p){ return '<span class="pill">'+esc(p)+'</span>'; }).join('');
      }
    }

    if (c.faq){
      setText('faq-eyebrow', c.faq.eyebrow);
      setText('faq-heading', c.faq.heading);
      var faqRoot = document.getElementById('faq-list');
      if (faqRoot && c.faq.items){
        faqRoot.innerHTML = c.faq.items.map(function(f){
          return '<details class="faq-item"'+(f.openByDefault?' open':'')+'><summary>'+esc(f.question)+'<span class="plus">+</span></summary><p>'+esc(f.answer)+'</p></details>';
        }).join('');
      }
    }

    if (c.contact){
      setText('contact-eyebrow', c.contact.eyebrow);
      setText('contact-heading', c.contact.heading);
      setText('contact-intro', c.contact.intro);
      var cards = document.getElementById('contact-cards');
      if (cards){
        var phoneDigits = onlyDigits(c.contact.phone);
        cards.innerHTML =
          '<div class="contact-card"><div class="left"><div class="icon-badge">'+icon('phone','icon')+'</div><div><div class="k">Phone</div><a class="v" href="tel:'+phoneDigits+'">'+esc(c.contact.phone)+'</a></div></div></div>'+
          '<div class="contact-card"><div class="left"><div class="icon-badge">'+icon('mail','icon')+'</div><div><div class="k">Email</div><a class="v" href="mailto:'+esc(c.contact.email)+'">'+esc(c.contact.email)+'</a></div></div><button class="copy-btn" data-copy="'+esc(c.contact.email)+'">Copy</button></div>'+
          '<div class="contact-card"><div class="left"><div class="icon-badge">'+icon('map-pin','icon')+'</div><div><div class="k">Address</div><span class="v">'+esc(c.contact.address)+'</span></div></div></div>';
        var copyBtn = cards.querySelector('.copy-btn');
        if (copyBtn){
          copyBtn.addEventListener('click', function(){
            var text = copyBtn.getAttribute('data-copy');
            if (navigator.clipboard){
              navigator.clipboard.writeText(text).then(function(){
                copyBtn.textContent='Copied';
                setTimeout(function(){ copyBtn.textContent='Copy'; },1400);
              });
            }
          });
        }
      }
    }

    if (c.footer){
      setText('footer-address-line', c.footer.addressLine);
      setText('footer-copyright', c.footer.copyright);
    }

    if (c.sections){
      var root = document.getElementById('sections-root');
      c.sections.forEach(function(s){
        var sec = document.getElementById('section-'+s.id);
        if (!sec || !root) return;
        sec.style.display = s.visible ? '' : 'none';
        root.appendChild(sec);
      });
    }

    initReveal();
  }

  function initReveal(){
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var selectors = '.section-head, .card, .why-item, .contact-card, .faq-item, .areas-band';
    var els = Array.prototype.slice.call(document.querySelectorAll(selectors));
    els.forEach(function(el, i){
      el.classList.add('reveal');
      el.style.transitionDelay = (i % 4) * 60 + 'ms';
    });
    if (!('IntersectionObserver' in window)){
      els.forEach(function(el){ el.classList.add('revealed'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.classList.add('revealed');
          io.unobserve(entry.target);
        }
      });
    }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(el){ io.observe(el); });
  }

  fetch('content.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(err){ console.error('THelectrics: failed to load content.json', err); });
})();
</script>
</body>
</html>
